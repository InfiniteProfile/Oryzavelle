<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>ORYZAVELLE — There is no last one.</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ORYZAVELLE</h1>
  <p class="tag">THERE IS NO LAST ONE.</p>
  <button id="arch" class="b ghost" hidden>ARCHIVE</button>
</header>

<form id="f" autocomplete="off">
  <input id="q" type="text" inputmode="numeric" maxlength="100" placeholder="Enter any ID" aria-label="Profile ID" enterkeyhint="go">
  <button type="submit" class="b">GO</button>
  <button type="button" id="dis" class="b">DISCOVER</button>
</form>
<div id="pos" class="pos" aria-live="off"></div>

<main id="sc"><div id="st"></div></main>

<div id="modal" class="modal" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mk" id="mk"></div>
    <div class="mid" id="mi"></div>
    <h2 id="mt"></h2>
    <div class="mc" id="mc"></div>
    <dl id="md"></dl>
    <p id="mp"></p>
    <div id="ml" class="links"></div>
    <div class="nav">
      <button class="b" data-act="prev">PREVIOUS</button>
      <button class="b" data-act="next">NEXT</button>
      <button class="b" data-act="back" id="bk" hidden>BACK</button>
      <button class="b" data-act="close" id="cl">CLOSE</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
